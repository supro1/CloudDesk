[project]
name = "project-1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "suprobho santra", email = "suprobho.santra@molgroup.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "aiosqlite>=0.20,<1",
    "asyncpg>=0.29,<1",
    "langchain>=1.4.7",
    "pydantic-settings>=2.10,<3",
    "pyjwt>=2.10,<3",
    "python-dotenv>=1.0",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn>=0.30,<1",
]

[project.scripts]
project-1 = "project_1:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.26,<2",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
