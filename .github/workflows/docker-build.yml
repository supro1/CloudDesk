name: Docker build

on:
  pull_request:
  push:
    branches: [development, testing, main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: clouddesk-backend:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          tags: clouddesk-frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8000
      - uses: docker/build-push-action@v6
        with:
          context: deployment/docker/qdrant
          file: deployment/docker/qdrant/Dockerfile
          push: false
          tags: clouddesk-qdrant:${{ github.sha }}
